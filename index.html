<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Pagina index</title>
        <style>
            body {
                font-family: Arial, sans-serif;
                margin: 0;
                padding: 0;
                background-color: whitesmoke;
            }
            header {
                background-color: orange;
                padding: 15px;
            }
            nav a {
                color: white;
                text-decoration: none;
                margin: 0 20px;
                font-size: 18px;
                font-weight: bold;
            }
            nav  a:hover {
                color: antiquewhite;
            }
            .contenido {
                padding: 40px;
                text-align: center;
            }
            h1 {
                font-size: 50px;
                color: burlywood;
            }
            img {
                max-width: 100%;
                width: 450px;
                height: auto;
                border-radius: 8px;
                box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.1);
                margin-top: 20px;
            }
        </style>
    </head>
    <body>
        <header>
            <nav>
                <a href="#">Pagina 1</a>
                <a href="#">Pagina 2</a>
                <a href="#">Pagina 3</a>
            </nav>
        </header>

        <div class="contenido">
            <h1>Pagina de felinos</h1>
            <img src="felinos.jpg" alt="Imagen de felinos">
        </div>

    </body>
</html>
